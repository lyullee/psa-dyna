[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psa-dyna"
version = "0.1.0"
description = "A physics-based, non-isothermal dynamic pressure swing adsorption model"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "pressure swing adsorption",
  "PSA",
  "VPSA",
  "hydrogen purification",
  "adsorption",
  "dynamic simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/lyullee/psa-dyna"
Repository = "https://github.com/lyullee/psa-dyna"
Documentation = "https://github.com/lyullee/psa-dyna/tree/main/docs"
Issues = "https://github.com/lyullee/psa-dyna/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
]

[project.scripts]
psa-dyna = "psa_dynamic.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
